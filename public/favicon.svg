<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#1a365d"/>
  
  <!-- Ticket shape -->
  <rect x="16" y="12" width="32" height="40" rx="4" fill="#ffffff"/>
  
  <!-- Ticket perforations (left and right notches) -->
  <circle cx="16" cy="26" r="4" fill="#1a365d"/>
  <circle cx="48" cy="26" r="4" fill="#1a365d"/>
  
  <!-- Dashed line separator -->
  <line x1="20" y1="26" x2="44" y2="26" stroke="#1a365d" stroke-width="1" stroke-dasharray="3,2" opacity="0.3"/>
  
  <!-- TURNO text -->
  <text x="32" y="20" text-anchor="middle" fill="#1a365d" font-size="6" font-weight="bold" font-family="Arial, sans-serif">TURNO</text>
  
  <!-- Number -->
  <text x="32" y="42" text-anchor="middle" fill="#38b2ac" font-size="18" font-weight="bold" font-family="Arial, sans-serif">01</text>
  
  <!-- Small decorative arrows -->
  <path d="M24 48 L28 46 L28 50 Z" fill="#1a365d" opacity="0.5"/>
  <path d="M40 48 L36 46 L36 50 Z" fill="#1a365d" opacity="0.5"/>
</svg>