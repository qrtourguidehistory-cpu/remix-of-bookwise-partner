<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="orangeGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8C42" />
      <stop offset="100%" style="stop-color:#FF6B1A" />
    </linearGradient>
  </defs>
  
  <!-- Background with orange gradient -->
  <rect width="64" height="64" rx="12" fill="url(#orangeGradient)" />
  
  <!-- MT Letters - large and bold with shadow effect -->
  <g>
    <!-- Shadow for depth -->
    <text
      x="32"
      y="48"
      text-anchor="middle"
      fill="#000000"
      font-size="32"
      font-weight="900"
      font-family="Arial, sans-serif"
      opacity="0.25"
      transform="translate(1.5, 1.5)"
    >
      MT
    </text>
    <!-- Main MT text -->
    <text
      x="32"
      y="48"
      text-anchor="middle"
      fill="#000000"
      font-size="32"
      font-weight="900"
      font-family="Arial, sans-serif"
    >
      MT
    </text>
  </g>
  
  <!-- Ticket icon above MT letters - positioned to overlap -->
  <g transform="translate(42, 10)">
    <!-- Ticket shape - torn/ripped edge on right -->
    <rect
      x="0"
      y="0"
      width="18"
      height="10"
      rx="2"
      fill="#000000"
      opacity="0.95"
    />
    <!-- Perforated/jagged edge on right -->
    <path
      d="M 18 2 L 18.5 3 L 18 4 L 18.5 5 L 18 6 L 18.5 7 L 18 8 L 18.5 9 L 18 10"
      stroke="#000000"
      fill="none"
      stroke-width="0.5"
    />
    <!-- Cover with orange gradient for torn effect -->
    <path
      d="M 18 0 L 20 0 L 20 10 L 18 10 Z"
      fill="url(#orangeGradient)"
    />
    <!-- Double arrow indicators pointing right -->
    <path
      d="M 8 3 L 10 5 L 8 7 M 11 3 L 13 5 L 11 7"
      stroke="#000000"
      fill="none"
      stroke-width="1.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
